name: RAMY editorial and visual acceptance
on:
  push:
    branches: [ramy/mobile-console-v13]
    paths: ['.github/workflows/ramy-ui-review.yml', 'ramy-console/apply_editorial_revision.py', 'ramy-console/refine_styles.py', 'ramy-console/package_reviewed_artwork.py', 'ramy-console/tests/review_ui_test.py']
permissions:
  contents: write
concurrency:
  group: ramy-ui-review
  cancel-in-progress: false
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ramy/mobile-console-v13
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install verification dependencies
        run: |
          python -m pip install Pillow==12.3.0 playwright==1.62.0
          python -m playwright install --with-deps chromium
      - name: Apply checked source changes and embed artwork
        run: |
          if ! grep -q 'const artwork=n' ramy-console/app.js; then
            python ramy-console/apply_editorial_revision.py
            python ramy-console/refine_styles.py
            python ramy-console/package_reviewed_artwork.py
          fi
          python - <<'PY'
          from pathlib import Path
          test=Path('ramy-console/tests/review_ui_test.py')
          source=test.read_text()
          source=source.replace("page.locator('[data-action=master]:visible').first.click()", "page.locator('#tools [data-action=master]:visible').first.click()")
          test.write_text(source)
          css=Path('ramy-console/styles.css')
          rules='\n/* Keep report headings and short sections with their data. */\n@media print{.report-content > .panel{break-inside:avoid-page}.report-content .panel-head,.report-content .panel-head+p{break-after:avoid-page}}\n'
          if '/* Keep report headings' not in css.read_text():css.write_text(css.read_text()+rules)
          PY
      - name: Verify calculations and JavaScript syntax
        run: |
          for f in ramy-console/*.js; do node --check "$f"; done
          node --test ramy-console/tests/*.test.js
      - name: Build application
        run: python ramy-console/build.py
      - name: Verify real storage, exports, layout and editorial changes
        run: python ramy-console/tests/review_ui_test.py
      - name: Commit verified application source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ramy-console/app.js ramy-console/core.js ramy-console/reports.js ramy-console/styles.css ramy-console/index.html ramy-console/sw.js ramy-console/assets.js ramy-console/artwork.js ramy-console/artwork-provenance.json ramy-console/editorial-changes.json ramy-console/tests/core.test.js ramy-console/tests/review_ui_test.py
          if ! git diff --cached --quiet; then
            git commit -m 'fix(ramy): remove numbered screens, revise professional copy, embed transparent crest and financial artwork'
            git push origin HEAD:ramy/mobile-console-v13
          fi
          git rev-parse HEAD > ramy-console/review-evidence/source-commit.txt
      - name: Preserve actual test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RAMY-UI-review-evidence
          path: ramy-console/review-evidence/
      - name: Preserve verified application build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: RAMY-reviewed-application
          path: |
            ramy-console/dist/
            ramy-console/RAMY_Standalone.html
            ramy-console/RAMY_Web_App.zip
